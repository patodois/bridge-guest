[package]
name = "bridge-guest"
version = "0.1.0"
edition = "2021"
description = "Puts any rewrite-bridge provider's model into any game that hosts the passthrough link, drawn on the GPU with the host's camera and depth-tested against the host's geometry"
license = "MIT OR Apache-2.0"
# A local tool: it needs your own game installs to do anything
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
rewrite-bridge = { version = "0.2.2", features = ["link"] }
rewrite-bridge-bevy = "0.2.2"

# The providers, by public git revision (Minecraft from crates.io). Each is a cargo feature, so a build can carry only
# the games you own.
wt-unpack = { git = "https://github.com/patodois/wt-unpack", rev = "f9f0515b08ca4256a583b2e86c37857eaa1e2036", features = ["bridge"], optional = true }
wf-unpack = { git = "https://github.com/patodois/wf-unpack", rev = "5db618feec7ec0418d9f23351067b7f286ee03d1", features = ["bridge"], optional = true }
hytale-unpack = { git = "https://github.com/patodois/hytale-unpack", rev = "889a70fd7adbcd10296e40cbac682a0ef786a8df", optional = true }
nocturne-unpack = { git = "https://github.com/patodois/nocturne-unpack", rev = "49df6cc0df8e1d60d9e0b1c6cc84473ee45d28e6", features = ["bridge"], optional = true }
mc-unpack = { version = "0.1.0", features = ["bridge"], optional = true }

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_animation",
    "bevy_curve",
    "bevy_camera",
    "bevy_light",
    "bevy_render",
    "bevy_pbr",
    "bevy_core_pipeline",
    "bevy_shader",
    "bevy_window",
    "bevy_winit",
    "bevy_sprite",
    "bevy_sprite_render",
    "zstd_rust",
    "tonemapping_luts",
    "png",
    "x11",
    "wayland",
]

[features]
default = ["wt", "wf", "hytale", "nocturne", "mc"]
wt = ["dep:wt-unpack"]
wf = ["dep:wf-unpack"]
hytale = ["dep:hytale-unpack"]
nocturne = ["dep:nocturne-unpack"]
mc = ["dep:mc-unpack"]

# Bevy and the game readers are far too slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
debug = "line-tables-only"

