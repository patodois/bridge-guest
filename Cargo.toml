[package]
name = "bridge-guest"
version = "0.1.0"
edition = "2021"
description = "Puts any rewrite-bridge provider's model into any game that hosts the passthrough link, drawn on the GPU with the host's camera and depth-tested against the host's geometry"
license = "MIT OR Apache-2.0"
# A local tool: it needs your own game installs to do anything
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
rewrite-bridge = { version = "0.3.1", features = ["link"] }
rewrite-bridge-bevy = "0.3.0"

# The providers, by public git revision (their rewrite-bridge 0.3 commits). Each is a cargo feature, so a build can carry only
# the games you own.
wt-unpack = { git = "https://github.com/patodois/wt-unpack", rev = "c06c71cd9d3e57b686b5e98531c681aef18b40a3", features = ["bridge"], optional = true }
wf-unpack = { git = "https://github.com/patodois/wf-unpack", rev = "c482a56e7480335b15f336af96f563430be01ac7", features = ["bridge"], optional = true }
hytale-unpack = { git = "https://github.com/patodois/hytale-unpack", rev = "c29e8db3e98fa86fdbba2b2bf78e8f0e32c4aa3e", optional = true }
nocturne-unpack = { git = "https://github.com/patodois/nocturne-unpack", rev = "355d5787c88c422c8e074592b1f5e1d54b381e49", features = ["bridge"], optional = true }
mc-unpack = { git = "https://github.com/patodois/mc-unpack", rev = "43ef7eff2246cb400843dace1072976103f83814", features = ["bridge"], optional = true }

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_animation",
    "bevy_curve",
    "bevy_camera",
    "bevy_light",
    "bevy_render",
    "bevy_pbr",
    "bevy_core_pipeline",
    "bevy_shader",
    "bevy_window",
    "bevy_winit",
    "bevy_sprite",
    "bevy_sprite_render",
    "zstd_rust",
    "tonemapping_luts",
    "png",
    "x11",
    "wayland",
]

[features]
default = ["wt", "wf", "hytale", "nocturne", "mc"]
wt = ["dep:wt-unpack"]
wf = ["dep:wf-unpack"]
hytale = ["dep:hytale-unpack"]
nocturne = ["dep:nocturne-unpack"]
mc = ["dep:mc-unpack"]

# Bevy and the game readers are far too slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
debug = "line-tables-only"

